<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShowLamb">
<title>ShowLamb</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="sheepclip"><path id="sheeppath"/></clipPath>
    <pattern id="kerryhead" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#f7f4ec"/><circle cx="18" cy="20" r="11" fill="#151515"/><circle cx="46" cy="44" r="9" fill="#151515"/>
    </pattern>
    <pattern id="speckle" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#f4f0e6"/><circle cx="8" cy="9" r="6" fill="#1a1a1a"/><circle cx="30" cy="6" r="4" fill="#1a1a1a"/><circle cx="22" cy="26" r="7" fill="#1a1a1a"/><circle cx="40" cy="34" r="5" fill="#1a1a1a"/><circle cx="7" cy="38" r="4" fill="#1a1a1a"/>
    </pattern>
    <pattern id="smut" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7a6a5c"/><circle cx="10" cy="10" r="8" fill="#3d332c"/><circle cx="30" cy="28" r="9" fill="#3d332c"/><circle cx="32" cy="6" r="4" fill="#a8998a"/>
    </pattern>
    <pattern id="kerryleg" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f7f4ec"/><rect width="40" height="18" fill="#151515"/>
    </pattern>
  </defs>
</svg>
<div id="app"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
